name: Build Windows installer (parts)

on:
  workflow_dispatch:
    inputs:
      part_size_mb:
        description: "Размер одной части в МБ"
        required: false
        default: "45"
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - "electron-main.cjs"
      - "vite.config.ts"
      - "src/**"
      - "public/**"
      - "scripts/**"
      - ".github/workflows/build-windows-parts.yml"

jobs:
  build-windows-parts:
    name: Build and split Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Prepare Electron output
        shell: pwsh
        run: |
          if (Test-Path "electron-output") { Remove-Item "electron-output" -Recurse -Force }
          if (Test-Path ".output") {
            Copy-Item ".output" "electron-output" -Recurse -Force
          } elseif (Test-Path "dist") {
            New-Item -ItemType Directory -Force "electron-output/public" | Out-Null
            Copy-Item "dist/*" "electron-output/public" -Recurse -Force
          } else {
            throw "No .output or dist folder found after npm run build"
          }

      - name: Build Windows installer
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Prepare roof update metadata
        shell: pwsh
        run: |
          if (Test-Path "release/latest.yml") {
            Copy-Item "release/latest.yml" "release/latest-roof.yml" -Force
          }

      - name: Split installer into parts
        shell: pwsh
        run: |
          $size = "${{ github.event.inputs.part_size_mb }}"
          if ([string]::IsNullOrWhiteSpace($size)) { $size = "45" }
          $exe = Get-ChildItem "release" -Filter "*Setup*.exe" | Select-Object -First 1
          if (-not $exe) { throw "Установщик не найден в папке release" }
          New-Item -ItemType Directory -Force "release-parts" | Out-Null
          node scripts/split-file.cjs $exe.FullName "release-parts" $size
          Copy-Item "scripts/join-parts.bat" "release-parts/join-parts.bat" -Force
          if (Test-Path "release/latest-roof.yml") { Copy-Item "release/latest-roof.yml" "release-parts/" -Force }
          Get-ChildItem "release-parts" | ForEach-Object { Write-Host $_.Name $_.Length }

      - name: Upload installer parts
        uses: actions/upload-artifact@v4
        with:
          name: saro-windows-installer-parts
          path: release-parts/**
          if-no-files-found: error

      - name: Publish parts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-parts-${{ github.run_number }}
          name: SARO Windows installer (parts) #${{ github.run_number }}
          body: |
            Части установщика Windows. Скачайте все файлы *.partNNN и join-parts.bat в одну папку и запустите join-parts.bat.
          files: release-parts/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
