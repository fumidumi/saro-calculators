name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches:
      - codex/build-macos-1.0.13
    paths:
      - "package.json"
      - "electron-main.cjs"
      - "vite.config.ts"
      - "vite.desktop.config.ts"
      - "src/**"
      - "public/**"
      - "scripts/**"
      - ".github/workflows/build-macos-universal.yml"

jobs:
  build-macos:
    name: Build Intel and Apple Silicon DMG and ZIP
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run tests
        run: npm test

      - name: Build desktop frontend
        run: npm run build:desktop

      - name: Prepare Electron output
        run: npm run prepare:electron-output

      - name: Build Intel and Apple Silicon applications
        run: npx electron-builder --mac dmg zip --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Create SHA-256 checksums
        run: |
          cd release
          shasum -a 256 SARO-Roof-1.0.13-mac-x64.dmg SARO-Roof-1.0.13-mac-x64.zip SARO-Roof-1.0.13-mac-arm64.dmg SARO-Roof-1.0.13-mac-arm64.zip > SHA256SUMS-mac.txt

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: saro-roof-macos
          path: |
            release/SARO-Roof-1.0.13-mac-x64.dmg
            release/SARO-Roof-1.0.13-mac-x64.zip
            release/SARO-Roof-1.0.13-mac-arm64.dmg
            release/SARO-Roof-1.0.13-mac-arm64.zip
            release/SHA256SUMS-mac.txt
          if-no-files-found: error

      - name: Publish macOS release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: macos-${{ github.run_number }}
          name: SARO macOS 1.0.13
          body: |
            Separate macOS builds for Intel (x64) and Apple Silicon (arm64).
            The applications are ad-hoc signed and are not notarized by Apple.
          files: |
            release/SARO-Roof-1.0.13-mac-x64.dmg
            release/SARO-Roof-1.0.13-mac-x64.zip
            release/SARO-Roof-1.0.13-mac-arm64.dmg
            release/SARO-Roof-1.0.13-mac-arm64.zip
            release/SHA256SUMS-mac.txt
