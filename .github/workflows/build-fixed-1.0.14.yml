name: Build localhost desktop 1.0.16

on:
  workflow_dispatch:
  push:
    branches:
      - codex/fix-porch-interaction-1.0.14

jobs:
  macos:
    name: macOS DMG (Intel and Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install the exact locked dependencies
        run: bun install --frozen-lockfile
      - name: Build desktop interface
        run: bun run build:desktop && bun run prepare:electron-output
      - name: Verify real mouse and keyboard input
        run: bun run smoke:electron
      - name: Build Intel DMG
        run: bunx electron-builder --mac dmg --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Build Apple Silicon DMG
        run: bunx electron-builder --mac dmg --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Verify the packaged Apple Silicon application after soak
        run: |
          app_binary="$(find release/mac-arm64 -type f -path '*/Contents/MacOS/*' -perm +111 | head -n 1)"
          test -n "$app_binary"
          SARO_PACKAGED_SMOKE=1 "$app_binary"
      - name: Checksums
        run: shasum -a 256 release/*.dmg | tee release/SHA256SUMS-macos.txt
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: saro-macos-1.0.16
          path: |
            release/*.dmg
            release/SHA256SUMS-macos.txt

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install the exact locked dependencies
        run: bun install --frozen-lockfile
      - name: Build desktop interface
        run: bun run build:desktop && bun run prepare:electron-output
      - name: Verify real mouse and keyboard input
        run: bun run smoke:electron
      - name: Build installer
        run: bunx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Verify the packaged Windows application after soak
        shell: pwsh
        run: |
          $exe = Get-ChildItem "release/win-unpacked" -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "Packaged application not found" }
          $env:SARO_PACKAGED_SMOKE = "1"
          & $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw "Packaged smoke test failed with exit code $LASTEXITCODE" }
      - name: Checksums
        shell: pwsh
        run: Get-FileHash release/*.exe -Algorithm SHA256 | Format-Table -AutoSize | Out-File release/SHA256SUMS-windows.txt
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: saro-windows-1.0.16
          path: |
            release/*.exe
            release/SHA256SUMS-windows.txt
